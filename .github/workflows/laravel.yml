name: CI/CD — Obra360

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Testes, qualidade e build
  # ──────────────────────────────────────────────────────────────
  test:
    name: Testes & Qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, gd, zip, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Copy environment file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check PHP style
        run: ./vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy para HostGator (só em push na main)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → HostGator
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (build assets de produção)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets (produção)
        run: |
          npm ci
          npm run build

      - name: Instalar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Adicionar servidor aos known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Instalar dependências PHP (incluir vendor no deploy)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Criar pacote de deploy (tar com vendor)
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.env' \
              --exclude='node_modules' \
              --exclude='storage/app' \
              --exclude='storage/logs' \
              --exclude='*.docx' \
              -czf /tmp/obra360-deploy.tar.gz .
          echo "Tamanho: $(du -sh /tmp/obra360-deploy.tar.gz | cut -f1)"
          cp /tmp/obra360-deploy.tar.gz obra360-deploy.tar.gz

      - name: Upload, extrair e pós-deploy via SSH nativo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          COMMON_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30"

          # scp usa -P (maiúscula) para o porto; ssh usa -p (minúscula)
          scp -P "${SSH_PORT}" $COMMON_OPTS obra360-deploy.tar.gz "${SSH_USERNAME}@${SSH_HOST}:~/obra360app.com/"

          # Pós-deploy na mesma sessão SSH
          ssh -p "${SSH_PORT}" $COMMON_OPTS "${SSH_USERNAME}@${SSH_HOST}" bash -s <<'REMOTE'
            set -e
            cd ~/obra360app.com

            tar -xzf obra360-deploy.tar.gz
            rm -f obra360-deploy.tar.gz

            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache
            chmod -R 755 storage bootstrap/cache

            # cPanel MultiPHP só muda o PHP web; o CLI continua no sistema.
            # Usar o binário ea-php84 directamente para os comandos artisan.
            PHP=/opt/cpanel/ea-php84/root/usr/bin/php

            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            $PHP artisan event:cache
            $PHP artisan storage:link --force

            echo "Deploy concluído!"
          REMOTE
