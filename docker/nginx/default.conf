server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;
    client_max_body_size 64M;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. These repeat App\Http\Middleware\SecurityHeaders on
    # purpose: nginx serves public/build and public/images without ever calling
    # PHP, so the middleware never sees those responses. The values must agree
    # with the middleware's — a second X-Frame-Options with a different value
    # is an ambiguity the browser has to resolve on its own.
    #
    # The CSP is not here because it carries a per-request nonce, which nginx
    # cannot generate; it is emitted by the middleware, for the responses that
    # actually contain script.
    add_header X-Content-Type-Options "nosniff" always;
    # DENY, matching the middleware and the CSP's `frame-ancestors 'none'`.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
