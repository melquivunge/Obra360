services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obra360_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - obra360_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: obra360_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - obra360_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: obra360_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-obra360}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-obra360_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-obra360_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - obra360_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: obra360_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      UPLOAD_LIMIT: 64M
    networks:
      - obra360_network
    depends_on:
      - db

networks:
  obra360_network:
    driver: bridge

volumes:
  db_data:
    driver: local
