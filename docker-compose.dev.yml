services:
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: obra360_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      UPLOAD_LIMIT: 64M
    networks:
      - obra360_network
    depends_on:
      - db
